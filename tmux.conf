# Terminal: real tmux terminfo + true-color passthrough
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set-option -gw xterm-keys on

# can't use these for linux, gotta find another alternative
bind C-c run "tmux show-buffer | pbcopy"
bind C-v run "pbpaste | tmux load-buffer - && tmux paste-buffer"

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

set-option -g prefix C-a

unbind-key C-b
bind-key C-a send-prefix

# 1 is better than 0
set -g base-index 1
setw -g pane-base-index 1

# terminal names
set -g set-titles on

set -g mouse on

# Toggle mouse on with ^B m (prefix is C-a)
bind m \
  set -g mouse on \;\
  display 'Mouse: ON'

# Toggle mouse off with ^B M
bind M \
  set -g mouse off \;\
  display 'Mouse: OFF'


# activity monitor
setw -g monitor-activity on
set -g visual-activity on

# active window colors
setw -g window-status-current-style "fg=white,bg=blue,bright"

# better highlighting of active pane
set-option -g pane-active-border-style "fg=blue"

# vi keys in copy mode: v to select, y to yank
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-scroll-copy-mode'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
